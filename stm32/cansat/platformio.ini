[platformio]
default_envs = transmitter

; DevEBox STM32H743 — прошивка через DFU (brew install dfu-util)
; Перед upload: переставь джампер BOOT0 в 3.3V, нажми SRT
; После upload: верни джампер обратно в GND, нажми SRT
[common]
upload_command = dfu-util -a 0 -s 0x08000000 -D .pio/build/$PIOENV/firmware.bin

; ===== ПЕРЕДАТЧИК (плата / канsat) =====
[env:transmitter]
platform  = ststm32
board     = devebox_h743vitx
framework = arduino
monitor_speed  = 115200
upload_command = ${common.upload_command}
extra_scripts  = post:extra_script.py
check_severity = medium
check_flags =
    cppcheck: --suppress=syntaxError
build_flags =
    -D MODE_TRANSMITTER
    -D XBEE_RX_PIN=PA10
    -D XBEE_TX_PIN=PA9
    -D GPS_RX_PIN=PA1
    -D GPS_TX_PIN=PA0
    -D GPS_BAUD=38400UL
    -D IMU_SCL_PIN=PD12
    -D IMU_SDA_PIN=PD13
    -D INA_SCL_PIN=PB6
    -D INA_SDA_PIN=PB7
    -D BME_SCL_PIN=PB8
    -D BME_SDA_PIN=PB9
    -D SERVO1_PIN=PE9
    -D SERVO2_PIN=PE11
    -D SERVO3_PIN=PE13
    -D SERVO4_PIN=PE14
    ; Для надёжности в API mode укажи 64-bit адрес наземного XBee (SH/SL).
    ; Дефолт ниже — broadcast 0x000000000000FFFF.
    -D XBEE_DEST_ADDR64_HI=0x00000000UL
    -D XBEE_DEST_ADDR64_LO=0x0000FFFFUL

; ===== ПРИЁМНИК (наземная станция) =====
[env:receiver]
platform  = ststm32
board     = devebox_h743vitx
framework = arduino
monitor_speed  = 115200
upload_command = ${common.upload_command}
extra_scripts  = post:extra_script.py
check_severity = medium
check_flags =
    cppcheck: --suppress=syntaxError
build_flags =
    -D MODE_RECEIVER
    -D XBEE_RX_PIN=PA10
    -D XBEE_TX_PIN=PA9
    -D GPS_RX_PIN=PA1
    -D GPS_TX_PIN=PA0
    -D IMU_SCL_PIN=PD12
    -D IMU_SDA_PIN=PD13
    -D INA_SCL_PIN=PB6
    -D INA_SDA_PIN=PB7
    -D BME_SCL_PIN=PB8
    -D BME_SDA_PIN=PB9
    -D SERVO1_PIN=PE9
    -D SERVO2_PIN=PE11
    -D SERVO3_PIN=PE13
    -D SERVO4_PIN=PE14
    -D XBEE_DEST_ADDR64_HI=0x00000000UL
    -D XBEE_DEST_ADDR64_LO=0x0000FFFFUL

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<common/protocol/>
